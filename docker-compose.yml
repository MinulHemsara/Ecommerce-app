services:
  app:
    build: .
    container_name: ecomapp_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - ecomnet
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      COMPOSER_IPRESOLVE: 4
      COMPOSER_HTTP_TIMEOUT: 300


  web:
    image: nginx:1.27-alpine
    container_name: ecomapp_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ecomnet

  db:
    image: mysql:8.0
    container_name: ecomapp_db
    environment:
      MYSQL_DATABASE: ecommerceapp
      MYSQL_USER: ecomuser
      MYSQL_PASSWORD: ecompass
      MYSQL_ROOT_PASSWORD: rootpass
    # ports:
    #   - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - ecomnet

  redis:
    image: redis:7-alpine
    container_name: ecomapp_redis
    ports:
      - "6379:6379"
    networks:
      - ecomnet

  memcached:
    image: memcached:alpine
    container_name: ecomapp_memcached
    ports:
      - "11211:11211"
    networks:
      - ecomnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecomapp_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on:
      - db
    networks:
      - ecomnet


networks:
  ecomnet:

volumes:
  mysqldata:
